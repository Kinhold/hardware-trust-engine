
[package]
name = "hardware-trust-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Pre-alpha Kinhold scaffold for unverified attestation envelopes and verifier plugins."
repository = "https://github.com/Kinhold/hardware-trust-engine"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Requires the embedding application to provide the native
# `barretenberg_verify_proof` symbol with the documented ABI.
barretenberg-ffi = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "=1.8.1"
rand = "0.8"
thiserror = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
