
name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-rust:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: clippy, rustfmt
    - name: Install cargo-audit
      run: cargo install cargo-audit
    - name: Install cargo-deny
      run: cargo install cargo-deny
    - name: Rust Cache
      uses: actions/cache@v4
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles("**/Cargo.lock") }}
    - name: Check Rust formatting
      run: cargo fmt --check
    - name: Run Clippy (static analysis)
      run: cargo clippy -- -D warnings
    - name: Run Cargo Audit (vulnerability check)
      run: cargo audit
    - name: Run Cargo Deny (license check)
      run: cargo deny check
    - name: Build Rust library
      run: cargo build --verbose
    - name: Run Rust tests
      run: cargo test --verbose

  build-android:
    runs-on: ubuntu-latest
    needs: build-rust
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    - name: Rust Cache
      uses: actions/cache@v4
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles("**/Cargo.lock") }}
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    - name: Build Android AAR
      run: |-
        chmod +x ./bindings/android/build_aar.sh
        ./bindings/android/build_aar.sh

  build-ios:
    runs-on: macos-latest
    needs: build-rust
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    - name: Rust Cache
      uses: actions/cache@v4
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles("**/Cargo.lock") }}
    - name: Build Swift XCFramework
      run: |-
        chmod +x ./bindings/swift/build_xcframework.sh
        ./bindings/swift/build_xcframework.sh
